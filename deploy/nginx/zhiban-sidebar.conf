# #145 企微侧边栏站点。
# 与 #52 的控制台站点分开：侧边栏只需要 /sidebar/ 静态与 /zhiban/sidebar/ 接口，
# 其余路径一律 404，避免把控制台或 DSH Web 暴露在侧边栏域名下。
# 替换 <sidebar-domain> 后放到 /etc/nginx/sites-available/zhiban-sidebar.conf 并软链。
#
# 前置（企微后台，由项目方操作）：
#   1. DNS：<sidebar-domain> → 43.167.159.74
#   2. 应用「网页授权及 JS-SDK」可信域名 = <sidebar-domain>
#   3. 「企业微信授权登录」回调域 = <sidebar-domain>
#   4. 聊天工具栏页面地址 = https://<sidebar-domain>/sidebar/

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name <sidebar-domain>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <sidebar-domain>;

    ssl_certificate     /etc/letsencrypt/live/<sidebar-domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<sidebar-domain>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # 侧边栏产物：console/dist-sidebar
    root /var/www/zhiban;
    index index.html;
    client_max_body_size 64k;
    client_body_buffer_size 16k;

    # 侧边栏接口（登录、首屏、关闭）；SSE 不在侧边栏使用，普通反代即可
    location /zhiban/sidebar/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /sidebar {
        return 301 /sidebar/;
    }

    # 单页入口：/sidebar/ 与任何子路径都回到 index.html
    location /sidebar/ {
        try_files $uri $uri/ /sidebar/index.html;
    }

    # 带指纹的资源长缓存；index.html 不缓存
    location /sidebar/assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /sidebar/index.html {
        add_header Cache-Control "no-store" always;
    }

    # 侧边栏域名只对外提供侧边栏
    location / {
        return 404;
    }
}
