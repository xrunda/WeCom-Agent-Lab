# #52 控制台反向代理。
# 替换 <console-domain> 后放到 /etc/nginx/sites-available/zhiban.conf 并软链到 sites-enabled。
# DSH Web 只监听 127.0.0.1:3080，这里只暴露 /zhiban/api，其余路径全部落到控制台静态文件。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name <console-domain>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <console-domain>;

    ssl_certificate     /etc/letsencrypt/live/<console-domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<console-domain>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    root /var/www/zhiban/console;
    index index.html;
    client_max_body_size 12m;

    # 控制台 API 与 SSE：关闭缓冲，长连接不超时
    location /zhiban/api/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # DSH Web 本体不对公网暴露（即使误配了路径也拒绝）
    location /dsh/ {
        return 404;
    }

    # 带指纹的静态资源长缓存；index.html 不缓存，保证发版后立即生效
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
